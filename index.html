<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3分でできる♪無料婚活診断</title>
  <style>
    :root {
      --bg-color: #fdfbf7;
      --card-bg: #ffffff;
      --primary: #e8647c;
      --primary-hover: #d2536a;
      --text-main: #4a3e3d;
      --text-muted: #7c6e6d;
      --accent-gold: #d4af37;
      --accent-pink-light: #fce4e8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(232, 100, 124, 0.12);
      padding: 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header-tag {
      display: inline-block;
      background: var(--accent-pink-light);
      color: var(--primary);
      font-weight: bold;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .question-card {
      display: none;
      animation: fadeIn 0.4s ease-in-out;
    }

    .question-card.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .progress-bar {
      height: 6px;
      background: #f0f0f0;
      border-radius: 3px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .q-number {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .q-title {
      font-size: 1.15rem;
      font-weight: bold;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #ffffff;
      border: 2px solid #f0e6e8;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.95rem;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background: var(--accent-pink-light);
    }

    .start-btn {
      background: var(--primary);
      color: #fff;
      font-weight: bold;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      padding: 16px 32px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(232, 100, 124, 0.4);
      transition: all 0.2s ease;
      width: 100%;
    }

    .start-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    /* 診断結果スタイル */
    .result-card {
      display: none;
      animation: fadeIn 0.5s ease-in-out;
    }

    .result-type {
      font-size: 0.9rem;
      color: var(--accent-gold);
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .result-title {
      font-size: 1.4rem;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .result-box {
      background: #faf6f6;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .cta-btn {
      display: block;
      width: 100%;
      background: var(--primary); /* 全体の温かいテーマカラーに合わせたピンク系 */
      color: #ffffff;
      font-weight: bold;
      font-size: 1.1rem;
      text-decoration: none;
      border-radius: 30px;
      padding: 16px 0;
      box-shadow: 0 4px 14px rgba(232, 100, 124, 0.3);
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }

    .cta-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- スタート画面 -->
    <div id="start-screen">
      <span class="header-tag">たった3分でわかる</span>
      <h1>3分でできる♪<br>無料婚活診断</h1>
      <p class="subtitle">直感で選ぶだけで、あなたの婚活スタイルとピッタリなアプローチ方法がわかります！</p>
      <button class="start-btn" onclick="startQuiz()">診断をスタートする</button>
    </div>

    <!-- 設問エリア -->
    <div id="quiz-screen" style="display: none;">
      <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
      </div>
      <div id="questions-container"></div>
    </div>

    <!-- 診断結果画面 -->
    <div id="result-screen" class="result-card">
      <div class="result-type">YOUR TYPE</div>
      <h2 id="result-title" class="result-title"></h2>
      <div id="result-desc" class="result-box"></div>
      
      <!-- ★ TimeRex予約リンク設定済みボタン -->
      <a href="https://timerex.net/s/allcare.wagokoro_2acb/ebdbe029" target="_blank" class="cta-btn">和ごころ無料相談</a>
    </div>

  </div>

  <script>
    const questions = [
      {
        q: "Q1. 休日を一緒に過ごすなら、どんなデートが理想？",
        options: [
          { text: "おしゃれなカフェや話題のスポットへ出かける", type: "romantic" },
          { text: "のんびりとお互いの家や落ち着いた場所で過ごす", type: "harmony" },
          { text: "テーマパークや旅行などアクティブに楽しむ", type: "active" },
          { text: "お互いの趣味の時間を大切にしつつ一緒に過ごす", type: "realistic" }
        ]
      },
      {
        q: "Q2. パートナーに最も求めるポイントは？",
        options: [
          { text: "価値観の一致と居心地の良さ・安心感", type: "harmony" },
          { text: "誠実さと将来の安定感・信頼性", type: "realistic" },
          { text: "ときめきや感情の共有・フィーリング", type: "romantic" },
          { text: "お互いを高め合える自立した関係性", type: "active" }
        ]
      },
      {
        q: "Q3. 初対面の人と話すときのあなたのスタンスは？",
        options: [
          { text: "相手の話をじっくり聞いて共感する", type: "harmony" },
          { text: "共通の話題を見つけて楽しく盛り上げる", type: "romantic" },
          { text: "自然体で自分の考えを素直に伝える", type: "active" },
          { text: "様子を見ながら相手の雰囲気に合わせる", type: "realistic" }
        ]
      },
      {
        q: "Q4. 婚活を進める上で不安や悩みを感じるポイントは？",
        options: [
          { text: "自分に合う人がどんな人か具体的にわからない", type: "romantic" },
          { text: "条件や将来のライフプランが合うか気になる", type: "realistic" },
          { text: "相手に気を使いすぎて疲れてしまうことがある", type: "harmony" },
          { text: "自分のペースや自由な時間が減らないか心配", type: "active" }
        ]
      },
      {
        q: "Q5. 理想の結婚生活のイメージは？",
        options: [
          { text: "笑顔が絶えない穏やかで温かい家庭", type: "harmony" },
          { text: "いつまでも仲良く恋人のような関係", type: "romantic" },
          { text: "安定した土台の上でお互いを支え合う関係", type: "realistic" },
          { text: "お互いの夢や目標を応援し合える関係", type: "active" }
        ]
      }
    ];

    const results = {
      romantic: {
        title: "ロマンチック理想派タイプ",
        desc: "ときめきやフィーリングを大切にするあなた。直感や相性を重視する反面、理想が高くなりすぎて一歩踏み出せないことも。焦らず出会いの機会を増やしてみるのが成功の鍵です！"
      },
      realistic: {
        title: "堅実リアリストタイプ",
        desc: "将来の生活や相性をしっかり見据えて判断できるあなた。慎重で失敗が少ない一方、お相手への条件に縛られすぎない柔軟さを持つことで、素敵な出会いが一気に広がるはずです。"
      },
      harmony: {
        title: "調和・癒やし重視派タイプ",
        desc: "お相手への思いやりと優しさに溢れたあなた。居心地の良い関係を作れるのが大きな魅力ですが、少し遠慮しがちな面も。自分の本音を少しずつ伝えることが良縁を引き寄せます。"
      },
      active: {
        title: "アクティブ自立派タイプ",
        desc: "自分の世界を持ち、互いに高め合える関係を求めるあなた。自立した大人同士の爽やかなお付き合いが向いています。価値観を尊重し合えるパートナーとの出会いがベストです。"
      }
    };

    let currentQ = 0;
    const scores = { romantic: 0, realistic: 0, harmony: 0, active: 0 };

    function startQuiz() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      const qData = questions[currentQ];
      const progressPercent = ((currentQ + 1) / questions.length) * 100;
      document.getElementById('progress').style.width = progressPercent + '%';

      let html = `
        <div class="q-number">STEP ${currentQ + 1} / ${questions.length}</div>
        <div class="q-title">${qData.q}</div>
        <div class="options">
      `;

      qData.options.forEach(opt => {
        html += `<button class="option-btn" onclick="selectAnswer('${opt.type}')">${opt.text}</button>`;
      });

      html += `</div>`;
      document.getElementById('questions-container').innerHTML = html;
    }

    function selectAnswer(type) {
      scores[type]++;
      currentQ++;
      if (currentQ < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-screen').style.display = 'none';
      
      let highestType = 'harmony';
      let maxScore = -1;
      for (const [type, score] of Object.entries(scores)) {
        if (score > maxScore) {
          maxScore = score;
          highestType = type;
        }
      }

      const resData = results[highestType];
      document.getElementById('result-title').innerText = resData.title;
      document.getElementById('result-desc').innerText = resData.desc;
      document.getElementById('result-screen').style.display = 'block';
    }
  </script>
</body>
</html>
